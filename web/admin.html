<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex">
  <title>Niimparty · admin</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
  <link rel="stylesheet" href="/static/admin.css?v=1">
</head>
<body class="admin">
  <!-- Login -->
  <main id="login" class="app login hidden">
    <header class="top">
      <h1 data-i18n="adm_title"></h1>
    </header>
    <form id="login-form" class="stack" autocomplete="off">
      <label class="field">
        <span data-i18n="adm_pin"></span>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="msg msg-error hidden" role="alert"></p>
      <button class="btn btn-primary" type="submit" data-i18n="adm_enter"></button>
    </form>
  </main>

  <!-- Painel -->
  <div id="panel" class="hidden">
    <header class="bar">
      <strong data-i18n="adm_title"></strong>
      <a id="guest-link" class="link" href="/" target="_blank" rel="noopener" data-i18n="adm_guest_page"></a>
      <button id="logout" class="btn-text" type="button" data-i18n="adm_logout"></button>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" class="tab active" data-tab="label" aria-selected="true" data-i18n="adm_tab_label"></button>
      <button role="tab" class="tab" data-tab="queue" aria-selected="false">
        <span data-i18n="adm_tab_queue"></span> <span id="queue-count" class="count hidden"></span>
      </button>
      <button role="tab" class="tab" data-tab="photos" aria-selected="false" data-i18n="adm_tab_photos"></button>
    </nav>

    <p id="pause-banner" class="banner hidden" role="status"></p>

    <!-- Etiqueta -->
    <section id="tab-label" class="tab-body active">
      <div class="label-layout">
        <aside class="preview-col">
          <div class="card preview-card">
            <div class="preview-head">
              <h2 data-i18n="adm_preview"></h2>
              <span id="rendering" class="muted small hidden" data-i18n="adm_rendering"></span>
            </div>
            <figure class="preview-figure"><img id="preview-img" alt=""></figure>
            <div id="color-dots" class="dots hidden"></div>
            <p id="preview-note" class="muted small hidden" data-i18n="adm_preview_note"></p>
            <div id="warnings" class="msg msg-warn hidden" role="status"></div>
            <label class="btn btn-secondary btn-small" role="button">
              <span data-i18n="adm_test_photo"></span>
              <input id="test-photo" type="file" accept="image/*" hidden>
            </label>
            <p class="muted small" data-i18n="adm_test_photo_hint"></p>
          </div>
        </aside>

        <form id="settings" class="form-col" autocomplete="off">
          <fieldset class="card">
            <legend data-i18n="adm_template"></legend>
            <div id="templates" class="template-grid" role="radiogroup"></div>
          </fieldset>

          <fieldset class="card">
            <legend data-i18n="adm_event"></legend>
            <label class="field"><span data-i18n="adm_event_name"></span>
              <input id="event-name" type="text" maxlength="80"></label>
            <label class="field"><span data-i18n="adm_event_date"></span>
              <input id="event-date" type="date"></label>
          </fieldset>

          <fieldset class="card" id="texts-card">
            <legend data-i18n="adm_texts"></legend>
            <div id="texts" class="stack"></div>
            <p class="muted small" data-i18n="adm_vars_hint"></p>
            <label class="switch" id="guest-wrap">
              <input id="guest" type="checkbox">
              <span data-i18n="adm_guest"></span>
            </label>
            <p id="guest-unsupported" class="muted small hidden" data-i18n="adm_guest_unsupported"></p>
          </fieldset>

          <fieldset class="card">
            <legend data-i18n="adm_label_size"></legend>
            <div id="size-chips" class="chips"></div>
            <div id="size-custom" class="row">
              <label class="field"><span data-i18n="adm_width"></span>
                <input id="label-w" type="number" min="5" max="120" step="1" inputmode="decimal"></label>
              <label class="field"><span data-i18n="adm_height"></span>
                <input id="label-h" type="number" min="5" max="300" step="1" inputmode="decimal"></label>
            </div>
            <p id="size-fixed" class="muted small hidden"></p>
          </fieldset>

          <fieldset class="card">
            <legend data-i18n="adm_paper"></legend>
            <div class="chips" role="radiogroup">
              <label class="chip"><input type="radio" name="paper" value="photo"><span data-i18n="adm_paper_photo"></span></label>
              <label class="chip"><input type="radio" name="paper" value="regular"><span data-i18n="adm_paper_regular"></span></label>
            </div>
            <p id="paper-forced" class="muted small hidden" data-i18n="adm_paper_forced"></p>
          </fieldset>

          <fieldset class="card" id="logo-card">
            <legend data-i18n="adm_logo"></legend>
            <div class="row">
              <label class="btn btn-secondary btn-small" role="button">
                <span data-i18n="adm_logo_upload"></span>
                <input id="logo-file" type="file" accept="image/*" hidden>
              </label>
              <button id="logo-remove" class="btn btn-secondary btn-small hidden" type="button" data-i18n="adm_logo_remove"></button>
            </div>
            <p class="muted small" data-i18n="adm_logo_hint"></p>
          </fieldset>
          <div class="spacer"></div>
        </form>
      </div>

      <div id="savebar" class="savebar">
        <p id="save-msg" class="small" role="status"></p>
        <div class="row">
          <button id="discard" class="btn btn-secondary btn-small hidden" type="button" data-i18n="adm_discard"></button>
          <button id="save" class="btn btn-primary" type="button" data-i18n="adm_save" disabled></button>
        </div>
      </div>
    </section>

    <!-- Fila -->
    <section id="tab-queue" class="tab-body">
      <div class="card queue-card">
        <div>
          <p id="queue-state" class="big"></p>
          <p id="queue-reason" class="muted"></p>
          <p id="driver-note" class="muted small hidden" data-i18n="adm_driver_mock"></p>
        </div>
        <button id="queue-toggle" class="btn btn-primary" type="button"></button>
      </div>
      <p id="jobs-empty" class="muted center hidden" data-i18n="adm_empty"></p>
      <ul id="jobs" class="jobs"></ul>
    </section>

    <!-- Fotos -->
    <section id="tab-photos" class="tab-body">
      <div class="card stack">
        <p class="muted" data-i18n="adm_photos_hint"></p>
        <a id="zip" class="btn btn-primary" href="/admin/api/photos.zip" download data-i18n="adm_download_zip"></a>
        <button id="delete-all" class="btn btn-danger" type="button" data-i18n="adm_delete_all"></button>
        <p id="photos-msg" class="msg hidden" role="status"></p>
      </div>
    </section>
  </div>

  <p id="toast" class="toast hidden" role="status"></p>
  <script src="/static/admin.js?v=1"></script>
</body>
</html>
