name: Chá de bebê
description: Nuvem sorridente, lua e brilhos, cantos arredondados
orientation: portrait
photo:
  aspect: "4:5"
  margin_mm: 2
  corner_radius_mm: 4
frame:
  style: dashed
  border_mm: 0.5
  inset_mm: 1
texts:
  - id: title
    label: Título
    default: "Chá de bebê"
    font: LilitaOne-Regular
    size_mm: 4.5
  - id: subtitle
    label: Subtítulo
    default: "{evento}"
    font: InterDisplay-SemiBold
    size_mm: 2.6
guest_field:
  enabled: true
  label: Seu nome
  format: "com carinho, {nome}"
  max_chars: 24
  font: InterDisplay-Medium
  size_mm: 2.5
ornaments:
  - file: ornaments/nuvem.png
    position: photo-top-left
    size_mm: 15
    offset_mm: [6, 2]
  - file: ornaments/lua.png
    position: photo-top-right
    size_mm: 8
    offset_mm: [2, 2]
  - file: ornaments/brilhos.png
    position: photo-bottom-right
    size_mm: 12
    offset_mm: [5, 2]
example:
  event: do bebê Theo
  guest: Bia
